name: Personas

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

# A newer push to a pull request cancels the run of the commit it replaces. Every
# other run keys a group of its own, its run id, so it never waits behind another run
# and nothing cancels it: a push and a dispatched run. A re-run keys its own group
# too, so re-running an older commit's run never cancels the newest one.
concurrency:
  group: personas-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

permissions:
  contents: read

jobs:
  public-entry:
    name: Built persona entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the package
        run: pnpm run build
      - name: Check the public entry and semantic runner declarations
        run: >-
          pnpm exec tsc --noEmit --strict --allowImportingTsExtensions
          --module NodeNext --moduleResolution NodeNext --target ES2022 --skipLibCheck
          scripts/personas-public-entry.acceptance.ts scripts/personas/semantic.acceptance.ts
          scripts/personas/run-semantic.ts scripts/personas/published-lock.acceptance.ts
          scripts/personas/verify-release.ts
      - name: Import the built entry without a source alias
        run: node --experimental-strip-types --test scripts/personas-public-entry.acceptance.ts
      - name: Exercise the semantic runner and the release check without credentials
        run: node --experimental-strip-types --test scripts/personas/semantic.acceptance.ts
