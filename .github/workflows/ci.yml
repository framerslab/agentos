name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # bump-framers-deps.yml dispatches this workflow on its pull request branch: a pull request
  # opened with GITHUB_TOKEN starts no pull_request run. A dispatched run can read any secret a
  # step references, and that branch carries dependency updates nobody has read yet, so no step
  # that runs on workflow_dispatch may reference a repository secret.
  workflow_dispatch: {}

# The workflow's token can read the repository and nothing else.
permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    # Postgres service container for the Brain.openPostgres integration tests
    # (gated on AGENTOS_TEST_POSTGRES_URL — tests skip when env var is absent).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AGENTOS_TEST_POSTGRES_URL: postgresql://postgres:ci_test_password@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Package exports point at built files
        run: pnpm run verify:exports

      # The executor from the built package, as a host loads it: its prelude and
      # bindings are compiled source, and its engine resolves from node_modules.
      - name: The QuickJS executor runs from the built package
        run: |
          node --input-type=module -e "
          import { QuickJSExecutor } from './dist/cognition/emergent/executor/QuickJSExecutor.js';
          const executor = await QuickJSExecutor.create();
          const ran = await executor.run({ code: 'function execute(input) { return input.a + input.b; }', input: { a: 2, b: 3 }, globals: {}, timeoutMs: 2000, memoryMB: 16 });
          if (ran.status !== 'ok' || ran.output !== 5) { console.error(ran); process.exit(1); }
          console.log('QuickJSExecutor from dist:', ran.status, ran.output);
          "

      # The document reader from the built package: a worker cannot load the TypeScript the tests import, so its entry
      # is the compiled module beside loadIsolated.js.
      - name: The isolated document read runs from the built package
        run: |
          node --input-type=module -e "
          import { loadIsolated } from './dist/cognition/memory/io/ingestion/loadIsolated.js';
          const read = await loadIsolated('text', Buffer.from('read in a worker thread'));
          if (read.content !== 'read in a worker thread' || read.format !== 'txt') { console.error(read); process.exit(1); }
          console.log('loadIsolated from dist:', read.format, read.content);
          "

      - name: Built library exports preserve personal-source delivery policy
        run: |
          node --input-type=module <<'JS'
          import { createSourceDerivation, canDeliverSourceDerivation } from './dist/cognition/library/index.js';
          const dependency = {
            tenantId: 'tenant-a', ownerId: 'owner-a', connectionId: 'connection-a',
            generation: 1, sourceId: 'source-a', messageIds: ['message-a'],
            version: 'version-a', expiresAt: 1000,
          };
          const answer = createSourceDerivation([dependency]);
          const current = [{ ...dependency, connected: true, paused: false, searchAskEnabled: true, liveEnabled: false }];
          const context = { tenantId: 'tenant-a', ownerId: 'owner-a', surface: 'ask', liveOptIn: false };
          if (!canDeliverSourceDerivation(answer, context, current, 999)) throw new Error('private_delivery_refused');
          if (canDeliverSourceDerivation(answer, { ...context, surface: 'share' }, current, 999)) throw new Error('shared_delivery_allowed');
          if (canDeliverSourceDerivation(answer, context, current, 1000)) throw new Error('expired_delivery_allowed');
          JS

      - name: Built Postgres vectors accept the SQL adapter
        run: |
          node --input-type=module <<'JS'
          import { createPostgresAdapter } from '@framers/sql-storage-adapter';
          import { PostgresVectorStore } from './dist/cognition/rag/vector_stores/PostgresVectorStore.js';
          const db = createPostgresAdapter({ connectionString: process.env.AGENTOS_TEST_POSTGRES_URL });
          await db.open();
          try {
            const store = new PostgresVectorStore({ id: 'contract', type: 'postgres', adapter: db, manageSchema: false });
            await store.initialize();
            if (!await store.healthCheck()) throw new Error('adapter_health_failed');
            await db.transaction((tx) => store.withStorageTransaction(tx, async (view) => {
              if (!await view.healthCheck()) throw new Error('transaction_health_failed');
            }));
            await store.close();
            if ((await db.get('SELECT 1 AS n'))?.n !== 1) throw new Error('adapter_closed');
          } finally {
            await db.close();
          }
          JS

      - name: Lint
        run: pnpm run lint

      - name: Documentation states only what the code enforces
        run: |
          set -euo pipefail
          # Words the published pages may not use for the in-process node:vm executor.
          if grep -rn -i -E 'hardened|domain-restricted|host-realm escape is blocked|isolated context|security guarantees|safe[- ]by[- ]construction' \
              docs/architecture/EMERGENT_CAPABILITIES.md docs/architecture/ARCHITECTURE.md \
              src/cognition/emergent/SandboxedToolForge.ts src/cognition/emergent/ComposableToolBuilder.ts \
              src/cognition/emergent/EmergentCapabilityEngine.ts src/cognition/emergent/types.ts \
              src/safety/sandbox/executor/CodeSandbox.ts src/safety/sandbox/executor/ICodeSandbox.ts \
              src/cognition/emergent/executor/types.ts src/cognition/emergent/executor/InProcessExecutor.ts \
              src/cognition/emergent/executor/QuickJSExecutor.ts src/cognition/emergent/executor/guest-surface.ts \
              src/cognition/emergent/executor/guest-prelude.ts README.md docs/SELF_EXTENSION.md; then
            echo "::error::the documentation claims an isolation the executor does not provide (see docs/architecture/EMERGENT_CAPABILITIES.md, Sandbox Mode)"
            exit 1
          fi

      - name: Type check
        run: pnpm run typecheck

      # The Moonshine browser provider's integration test runs the real
      # @moonshine-ai/moonshine-wasm in Node on its tiny streaming model and a
      # recorded clip, fetched once and kept in the cache.
      - name: Cache the Moonshine test model
        uses: actions/cache@v5
        with:
          path: .cache/moonshine
          key: moonshine-test-tiny-streaming-en-quantized_26_07_30-cd95be77

      - name: Fetch the Moonshine test model
        run: |
          set -euo pipefail
          dir=.cache/moonshine
          mkdir -p "$dir/tiny-streaming-en"
          for f in adapter.ort cross_kv.ort decoder_kv.ort encoder.ort frontend.ort streaming_config.json tokenizer.bin; do
            [ -s "$dir/tiny-streaming-en/$f" ] || curl -fsSL --retry 3 -o "$dir/tiny-streaming-en/$f" \
              "https://download.moonshine.ai/model/tiny-streaming-en/quantized_26_07_30/$f"
          done
          [ -s "$dir/two_cities_16k.wav" ] || curl -fsSL --retry 3 -o "$dir/two_cities_16k.wav" \
            "https://raw.githubusercontent.com/moonshine-ai/moonshine/cd95be7728c5141b581a3fb8837742687c06c6d1/test-assets/two_cities_16k.wav"
          echo "AGENTOS_TEST_MOONSHINE_DIR=$PWD/$dir" >> "$GITHUB_ENV"

      - name: Test with coverage
        run: pnpm run test -- --coverage

      - name: Upload coverage to Codecov
        # Not on a dispatched run: see the note on workflow_dispatch above.
        if: always() && github.event_name != 'workflow_dispatch'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Browser tests
        run: pnpm run test:browser

  # Fast targeted gate for the batch-1 hardening test set: fails in minutes
  # without waiting on the coverage matrix. The full suite above is
  # failure-gating too (44-red burn-down completed 2026-07-20).
  batch1-tests:
    name: Batch-1 gated tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Batch-1 tests (failure-gating)
        run: >-
          pnpm vitest run
          src/core/llm/providers/__tests__/openai-cache-params.test.ts
          src/core/llm/providers/__tests__/default-judge.test.ts
          src/core/llm/providers/__tests__/openai-streaming-usage.test.ts
          src/core/llm/providers/implementations/__tests__/openai-typed-cache-options.test.ts
          src/api/__tests__/observability.genai.test.ts
          src/api/__tests__/inclusive-input-tokens.test.ts
          src/api/__tests__/hitl.llmJudge.test.ts
          src/cognition/emergent/__tests__/decay-for-agent.test.ts
          src/cognition/emergent/__tests__/adapt-personality.test.ts
          src/cognition/rag/__tests__/neo4j-graphrag-export.test.ts

  # Exercises the release configuration without tagging or publishing: the
  # commit analyser and the release-notes generator read the commits since
  # the last release tag, fed the way the Release workflow feeds them.
  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Analyse the commits since the last release tag
        run: node scripts/release-dry-run.mjs
