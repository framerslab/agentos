name: Release

# A release runs once a day, at 10:17 UTC, when master holds a change to release. The gate job
# reads the commits since the last release tag with git alone (.github/scripts/release-gate.mjs)
# and ends the run there, green, when none of them both carries a releasing type and changes what
# the package ships. Otherwise the whole CI suite runs on master's commit (ci.yml, called with
# release: true, which also sends the coverage the README badge reads) and the release job
# publishes that commit. Pushes to master run CI's quick checks only and never publish.
#
# To release now, dispatch this workflow on master:
#   gh workflow run release.yml --ref master
# force: true skips the gate's check; dry_run: true runs the gate, the suite and the release job up
# to the publish and stops there, so nothing is tagged, published or released.
# GitHub may start a scheduled run late when Actions is busy.
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Release without checking for releasing changes since the last tag
        type: boolean
        default: false
      dry_run:
        description: Stop before the publish; tag, publish and release nothing
        type: boolean
        default: false

permissions:
  contents: read

# One release run at a time, so two runs never race semantic-release's tag and version writes;
# a release run is never cancelled. The suite ci.yml runs for it keys a group of its own.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Releasable changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      releasable: ${{ steps.check.outputs.releasable }}
    steps:
      # A dispatched run can start on any branch, and the suite it calls reads the Codecov token;
      # a release comes from master alone.
      - name: Release from master only
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::a release runs on master; this run is on $GITHUB_REF"
          exit 1

      # Every commit and tag, without file contents: the check reads commit messages and the paths
      # each commit changes.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Check for releasing changes since the last tag
        id: check
        env:
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: node .github/scripts/release-gate.mjs

  suite:
    name: Suite
    needs: gate
    if: needs.gate.outputs.releasable == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      release: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  release:
    name: Release
    needs: [gate, suite]
    if: needs.gate.outputs.releasable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # The commit the suite tested: a scheduled or dispatched run's commit is master's when the run
      # started. When master has moved on since, semantic-release finds the local branch behind the
      # remote and publishes nothing; the next day's run releases the newer commit.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Verify build
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi

      - name: Refresh test-count badge
        run: node scripts/update-test-badge.mjs

      # Trusted publishing: @semantic-release/npm 13 exchanges the job's OIDC token with npm and then
      # publishes with no token in its npmrc, which needs npm 11.5.1 or newer. Node 22 ships npm 10,
      # whose publish ends in ENEEDAUTH (run 39490192582, 20 October 2026, after the trusted
      # publisher for @framers/agentos was set); agentos-extensions' release.yml has the same step.
      # ci.yml's Test & Lint job installs the same npm for the package checks; change both together.
      - name: Use npm 11 for trusted publishing
        run: |
          npm install -g npm@11.20.0
          test "$(npm --version)" = 11.20.0

      # npm publish --provenance records its provenance statement in Sigstore's transparency log before it uploads the
      # package. When the log records the entry but its reply does not reach npm, sigstore-js sends the entry again,
      # the log answers 409, and npm fails with TLOG_CREATE_ENTRY_ERROR: no npm release fetches the existing entry
      # instead (https://github.com/npm/cli/issues/10078). semantic-release has pushed the tag by then, so the version
      # reaches neither npm nor GitHub, and the next run finds nothing after the tag (runs 41126134054 and 41131650556).
      # After such a failure the script deletes the tag that attempt pushed, once npm and GitHub show no release of it,
      # and semantic-release runs once more after a 30-second pause, signing anew. A second conflict deletes that
      # attempt's tag too and fails the job, so the next run releases; any other failure fails the job as before.
      # shell: bash adds pipefail, so the if reads semantic-release's status rather than tee's.
      - name: Dry run, nothing published
        if: inputs.dry_run
        run: echo "dry_run is set; the release stops before semantic-release, so nothing is tagged, published or released"

      - name: Semantic Release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for attempt in 1 2; do
            output="$RUNNER_TEMP/semantic-release-$attempt.log"
            if pnpm exec semantic-release 2>&1 | tee "$output"; then
              exit 0
            fi
            node .github/scripts/drop-unpublished-release-tag.mjs "$output" || exit 1
            if [ "$attempt" = 1 ]; then
              sleep 30
            fi
          done
          exit 1
