name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# Serialize release runs (workflow_run events from back-to-back CI
# completions must not race semantic-release's tag/version writes);
# never cancel an in-progress publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Runs only after the CI workflow completes successfully on master.
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # semantic-release requires a branch checkout, so we stay on master and
      # instead guard that master still points at the CI-tested commit. When a
      # newer push has moved master, this run skips — that push's own CI run
      # releases it. Guarantees the published SHA is always a CI-passed SHA.
      - name: Verify master still points at the tested commit
        id: guard
        run: |
          TESTED="${{ github.event.workflow_run.head_sha }}"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" = "$TESTED" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "master ($HEAD_SHA) moved past tested commit ($TESTED); skipping — the newer push's CI will release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        if: steps.guard.outputs.should_release == 'true'
        run: pnpm install

      - name: Build
        if: steps.guard.outputs.should_release == 'true'
        run: pnpm run build

      - name: Verify build
        if: steps.guard.outputs.should_release == 'true'
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi

      - name: Refresh test-count badge
        if: steps.guard.outputs.should_release == 'true'
        run: node scripts/update-test-badge.mjs

      # Trusted publishing: @semantic-release/npm 13 exchanges the job's OIDC token with npm and then
      # publishes with no token in its npmrc, which needs npm 11.5.1 or newer. Node 22 ships npm 10,
      # whose publish ends in ENEEDAUTH (run 39490192582, 20 October 2026, after the trusted
      # publisher for @framers/agentos was set); agentos-extensions' release.yml has the same step.
      # ci.yml's Test & Lint job installs the same npm for the package checks; change both together.
      - name: Use npm 11 for trusted publishing
        if: steps.guard.outputs.should_release == 'true'
        run: npm install -g npm@11.20.0 && npm --version

      - name: Semantic Release
        if: steps.guard.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec semantic-release
