name: Breaking change gate

# A breaking change moves AgentOS to a new minor version (release.config.js),
# and every consumer pinned to the current minor has to move to it by hand.
# This check fails a pull request that carries a breaking-change marker unless
# a maintainer has added the label `breaking-approved`.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

# A newer event on a pull request (a push, an edit of its title or description, a
# label added or removed) cancels the gate run it supersedes, and the run that survives
# reads the pull request's title, description and labels from the API as they are now,
# not from its own event, so the order the events arrive in cannot pass a stale label.
# A re-run keys a group of its own, its run id, so re-running an older run never cancels
# the newest one.
concurrency:
  group: breaking-change-gate-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse an unapproved breaking change
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The gate reads the pull request as it is now, not as the event that started this run saw it. With
          # the concurrency group above, a labeled event delivered after an unlabeled one would cancel the
          # newer run and, read from its own payload, pass on a label that is already gone.
          pull="$(gh api "repos/$REPO/pulls/$PR")"
          TITLE="$(jq -r '.title' <<<"$pull")"
          BODY="$(jq -r '.body // ""' <<<"$pull")"
          LABELS="$(jq -r '[.labels[].name] | join(",")' <<<"$pull")"
          # The markers release.config.js reads: a type with `!` before the
          # colon, or a note keyword (BREAKING CHANGE, BREAKING CHANGES,
          # BREAKING) at the start of a line, followed by a colon or a space.
          subject='^[a-z]+(\([^)]*\))?!:'
          note='^[[:space:]*>-]*(BREAKING CHANGES?|BREAKING)[[:space:]]*:'
          found=""
          if printf '%s\n' "$TITLE" | grep -Eq "$subject"; then found="the title"; fi
          if printf '%s\n' "$BODY" | grep -Eq "$note"; then found="${found:+$found, }the description"; fi
          if gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" --jq '.[].commit.message' | grep -Eq "$subject|$note"; then
            found="${found:+$found, }a commit message"
          fi
          if [ -z "$found" ]; then
            echo "No breaking-change marker."
            exit 0
          fi
          case ",$LABELS," in
            *,breaking-approved,*)
              echo "Breaking-change marker in $found; approved with the breaking-approved label."
              exit 0
              ;;
          esac
          echo "::error::Breaking-change marker in $found. A breaking change releases a new minor version of AgentOS, and every consumer pinned to the current minor must move to it by hand. Make the change backward compatible and drop the marker, or ask a maintainer to add the breaking-approved label."
          exit 1
