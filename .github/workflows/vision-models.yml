name: Vision models

# The vision pipeline's local tiers end to end: the built package runs both
# OCR engines (ppu-paddle-ocr and tesseract.js, installed as peers) and loads
# each Hugging Face Hub model the model tiers name (TrOCR, Florence-2, CLIP),
# on sample images. The unit suite mocks those packages, so a result shape the
# code does not read, a model id that does not load, or a call a model does
# not take shows up here and nowhere else. Each run downloads about 3 GB of
# models.
on:
  pull_request:
    branches: [master]
    paths:
      - 'src/io/vision/**'
      - 'src/io/media/images/**'
      - 'src/core/types/vendor.d.ts'
      - 'scripts/vision-models-check.mjs'
      - '.github/workflows/vision-models.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  schedule:
    # Weekly: a Hub repository can change under a model id.
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vision-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  models:
    name: Local vision tiers load and run
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: OCR, TrOCR, Florence-2 and CLIP from the built package
        run: node scripts/vision-models-check.mjs
