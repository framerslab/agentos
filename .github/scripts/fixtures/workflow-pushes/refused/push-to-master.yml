# Pushes that name master, main or the default branch: refused from any workflow, a pull request's included.
name: push to master
on:
  pull_request:
    branches: [master]
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git push origin HEAD:master # lint-expect
      - name: Commit and push
        run: |
          git commit -am "chore: update the registry"
          git push origin HEAD:refs/heads/master # lint-expect
          git push --force origin +HEAD:main # lint-expect
          git push origin master # lint-expect
          git -C site push -u origin "HEAD:${{ github.event.repository.default_branch }}" # lint-expect
          git push origin HEAD:"$GITHUB_BASE_REF" # lint-expect
          git push origin --delete master # lint-expect
          git push --all origin # lint-expect
          out=$(git push origin HEAD:master 2>&1) || echo "$out" # lint-expect
          git push origin \
            HEAD:master # lint-expect
      - run: >-
          git push origin HEAD:master # lint-expect
