# semantic-release with @semantic-release/git commits the release to the branch the run is on.
name: release
on:
  push:
    branches: [master]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npx semantic-release # lint-expect
      - run: npx semantic-release --dry-run
      - uses: cycjimmy/semantic-release-action@v4 # lint-expect
