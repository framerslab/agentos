# Actions that push to master: by their inputs, or by their defaults on a run on master.
name: actions that push
on:
  push:
    branches: [master]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: master # lint-expect
      - name: Deploy the docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: master # lint-expect
      - uses: ad-m/github-push-action@master # lint-expect
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: stefanzweifel/git-auto-commit-action@v5 # lint-expect
        with:
          commit_message: 'chore: refresh the badge'
      - uses: EndBug/add-and-commit@v9 # lint-expect
        with:
          add: badge.json
      - uses: EndBug/add-and-commit@v9
        with:
          add: badge.json
          push: origin HEAD:master # lint-expect
