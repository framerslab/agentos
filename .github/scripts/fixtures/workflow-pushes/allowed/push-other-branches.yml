# A push trigger whose branch filter leaves master out, and a defaults.run mapping, which holds no script.
name: release branches
on:
  push:
    branches: ['release/**', '!master']
jobs:
  push:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - run: git push
