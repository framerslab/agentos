# A pull request workflow pushes the pull request's own branch: the checked-out branch is never master.
name: autofix
on:
  pull_request:
    branches: [master]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - run: |
          git commit -am "style: format"
          git push
          git push origin HEAD
          git push origin "HEAD:${{ github.head_ref }}"
      - uses: stefanzweifel/git-auto-commit-action@v5
