# semantic-release without @semantic-release/git: the tag, the package and the GitHub release carry the version.
name: release
on:
  push:
    branches: [master]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pnpm exec semantic-release
      - uses: cycjimmy/semantic-release-action@v4
