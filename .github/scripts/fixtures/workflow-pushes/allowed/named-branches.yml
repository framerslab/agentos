# A workflow that runs on master and pushes only branches of its own and tags, and text that names a push.
name: named branches
on:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Registry pull request
        run: |
          branch="chore/registry-update-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git checkout --quiet -b "$branch"
          git push --quiet origin "HEAD:refs/heads/$branch"
          git push origin HEAD:refs/heads/badges
          git push --force origin HEAD:agentos-live-docs
          git push origin v1.2.3
          git push --atomic origin "+refs/tags/v1.2.3:refs/tags/v1.2.3" "${refspecs[@]}"
          git push origin --tags
          git push --dry-run origin HEAD:master
          git push -n
          echo "::error::Push each tag from ${head}: git tag -f -a <tag> -m <tag> ${head} && git push --force origin HEAD:master"
          # git push origin HEAD:master
          node --input-type=module <<'JS'
          // git push origin HEAD:master
          JS
          git log --oneline -1 | grep -q master
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-deploy
          publish_branch: agentos-live-docs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: badges
      - uses: EndBug/add-and-commit@v9
        with:
          new_branch: badges
      - uses: EndBug/add-and-commit@v9
        with:
          push: false
      - uses: ad-m/github-push-action@master
        with:
          branch: gh-pages
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
